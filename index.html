<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Eclipse Esports · Neon</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font for better neon look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            font-family: 'Orbitron', 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* ---------- ANIMATED BACKGROUND (particles) ---------- */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(160, 120, 255, 0.3);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.2);
        }

        .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-duration: 18s; animation-delay: 0s; }
        .particle:nth-child(2) { width: 6px; height: 6px; left: 20%; animation-duration: 22s; animation-delay: 2s; }
        .particle:nth-child(3) { width: 3px; height: 3px; left: 35%; animation-duration: 16s; animation-delay: 4s; }
        .particle:nth-child(4) { width: 8px; height: 8px; left: 50%; animation-duration: 25s; animation-delay: 1s; }
        .particle:nth-child(5) { width: 5px; height: 5px; left: 65%; animation-duration: 20s; animation-delay: 3s; }
        .particle:nth-child(6) { width: 4px; height: 4px; left: 78%; animation-duration: 19s; animation-delay: 5s; }
        .particle:nth-child(7) { width: 7px; height: 7px; left: 88%; animation-duration: 23s; animation-delay: 2s; }
        .particle:nth-child(8) { width: 5px; height: 5px; left: 15%; animation-duration: 21s; animation-delay: 6s; }
        .particle:nth-child(9) { width: 3px; height: 3px; left: 45%; animation-duration: 17s; animation-delay: 0s; }
        .particle:nth-child(10) { width: 6px; height: 6px; left: 72%; animation-duration: 24s; animation-delay: 4s; }
        .particle:nth-child(11) { width: 4px; height: 4px; left: 92%; animation-duration: 20s; animation-delay: 7s; }
        .particle:nth-child(12) { width: 5px; height: 5px; left: 5%; animation-duration: 26s; animation-delay: 3s; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ---------- GLITCH OVERLAY ---------- */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.05s;
        }

        .glitch-overlay.active {
            opacity: 1;
        }

        /* Glitch scanlines (horizontal) */
        .glitch-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 255, 0.03) 2px,
                rgba(255, 0, 255, 0.03) 4px
            );
            animation: scanlines 0.1s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* Vertical glitch lines that go down the screen */
        .glitch-vertical-line {
            position: absolute;
            top: -10%;
            width: 2px;
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 
                0 0 10px rgba(255, 0, 255, 0.1),
                0 0 20px rgba(0, 200, 255, 0.05);
            animation: verticalGlitchDown 0.8s ease-in-out forwards;
        }

        /* Blur behind vertical lines */
        .glitch-vertical-line::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -15px;
            width: 32px;
            height: calc(100% + 40px);
            background: rgba(255, 0, 255, 0.02);
            filter: blur(8px);
            backdrop-filter: blur(4px);
            border-radius: 50%;
        }

        @keyframes verticalGlitchDown {
            0% { 
                transform: translateY(-10%) scaleY(0.5);
                opacity: 0;
            }
            10% { 
                opacity: 1;
            }
            90% { 
                opacity: 1;
            }
            100% { 
                transform: translateY(110%) scaleY(1);
                opacity: 0;
            }
        }

        /* Random horizontal glitch bars */
        .glitch-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.1), 0 0 40px rgba(0, 200, 255, 0.05);
            animation: glitchBar 0.3s ease-in-out;
        }

        @keyframes glitchBar {
            0% { opacity: 0; transform: translateX(-10%); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(10%); }
        }

        /* Random color shift glitch */
        .glitch-color {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 255, 0.02);
            mix-blend-mode: screen;
            animation: colorGlitch 0.15s ease-in-out;
        }

        @keyframes colorGlitch {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Screen shake effect */
        .glitch-shake {
            animation: shake 0.15s ease-in-out;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, 3px); }
            80% { transform: translate(2px, -3px); }
            100% { transform: translate(0, 0); }
        }

        /* ---------- FLYING CONTROLLER ---------- */
        .flying-controller {
            position: fixed;
            font-size: 3.5rem;
            color: #ff6bff;
            text-shadow: 
                0 0 20px rgba(255, 0, 255, 0.4),
                0 0 40px rgba(255, 0, 255, 0.2),
                0 0 60px rgba(0, 200, 255, 0.1);
            pointer-events: none;
            z-index: 1000;
            animation: flyController 2.5s ease-in-out forwards;
        }

        @keyframes flyController {
            0% { 
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            10% {
                opacity: 1;
                transform: scale(1.2) rotate(180deg);
            }
            30% {
                transform: scale(1) rotate(360deg);
            }
            60% {
                transform: scale(1.1) rotate(720deg);
            }
            90% {
                opacity: 1;
                transform: scale(1) rotate(900deg);
            }
            100% { 
                opacity: 0;
                transform: scale(0.8) rotate(1080deg);
            }
        }

        /* Controller trail effect */
        .controller-trail {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
            filter: blur(4px);
        }

        /* ---------- MAIN CARD (glassmorphism) ---------- */
        .main-card {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            width: 100%;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 3.5rem;
            padding: 3rem 2.5rem 4rem;
            border: 1px solid rgba(160, 120, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 80px rgba(100, 60, 255, 0.08);
            text-align: center;
            transition: box-shadow 0.3s;
        }

        .main-card:hover {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 120px rgba(130, 80, 255, 0.12);
        }

        /* ---------- LOGO (enhanced with neon ring) ---------- */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .logo-ring {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseRing 3s ease-in-out infinite;
        }

        /* outer glow ring */
        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff00ff, #00d4ff, #ff00ff, #a07aff, #ff00ff);
            padding: 3px;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
            animation: spinRing 6s linear infinite;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.3), 0 0 80px rgba(0, 200, 255, 0.1);
        }

        /* inner glow */
        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 0, 255, 0.15), transparent 70%);
            filter: blur(8px);
            z-index: 0;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseRing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(100, 60, 255, 0.2);
            position: relative;
            z-index: 1;
            transition: transform 0.3s;
            background: #0a0a12;
        }

        .logo-img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        /* ---------- NEON TEXT (COLORFUL) ---------- */
        .neon-title {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(90deg, #ff00ff, #00d4ff, #ff00ff, #a07aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 300% 100%;
            animation: gradientShift 4s ease-in-out infinite, flicker 3s infinite alternate;
            margin-bottom: 0.3rem;
            font-family: 'Orbitron', sans-serif;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.3)) drop-shadow(0 0 40px rgba(0, 200, 255, 0.2));
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.4)) drop-shadow(0 0 40px rgba(0, 200, 255, 0.3));
            }
            20%, 24%, 55% {
                filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.2)) drop-shadow(0 0 20px rgba(0, 200, 255, 0.1));
            }
        }

        .neon-sub {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #00d4ff;
            text-shadow: 
                0 0 10px rgba(0, 200, 255, 0.4),
                0 0 30px rgba(0, 200, 255, 0.2),
                0 0 60px rgba(0, 200, 255, 0.1);
            margin-top: -0.2rem;
            margin-bottom: 2.2rem;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        /* ---------- DIVIDER ---------- */
        .divider {
            width: 80px;
            height: 3px;
            margin: 0 auto 2.2rem;
            background: linear-gradient(90deg, transparent, #ff00ff, #00d4ff, #ff00ff, transparent);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        /* ---------- TAGLINE (PINK NEON) ---------- */
        .tagline {
            font-size: 1.4rem;
            font-weight: 400;
            color: #ff6bff;
            text-shadow: 
                0 0 10px rgba(255, 0, 255, 0.3),
                0 0 30px rgba(255, 0, 255, 0.15);
            max-width: 600px;
            margin: 0 auto 2.8rem;
            line-height: 1.6;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        .tagline i {
            color: #00d4ff;
            margin: 0 6px;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.4);
        }

        .tagline span {
            color: #a07aff;
            text-shadow: 0 0 15px rgba(160, 120, 255, 0.3);
        }

        /* ---------- SOCIAL LINKS (neon style) ---------- */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            flex-wrap: wrap;
            margin-bottom: 2.8rem;
            min-height: 60px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 255, 0.2);
            color: #ff6bff;
            font-size: 1.6rem;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.1);
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
            cursor: pointer;
        }

        .social-link:hover {
            transform: translateY(-6px) scale(1.08);
            border-color: #00d4ff;
            color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3), 0 0 60px rgba(255, 0, 255, 0.15);
            background: rgba(0, 200, 255, 0.05);
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.6);
        }

        .social-link i {
            transition: transform 0.2s;
        }

        .social-link:hover i {
            transform: scale(1.1);
        }

        /* ---------- CTA BUTTON (neon) ---------- */
        .btn-neon {
            display: inline-block;
            padding: 0.9rem 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00d4ff;
            background: transparent;
            border: 2px solid rgba(0, 200, 255, 0.4);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.1);
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.15), transparent);
            transition: left 0.6s;
        }

        .btn-neon:hover::before {
            left: 100%;
        }

        .btn-neon:hover {
            border-color: #ff00ff;
            color: #ff6bff;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.3), 0 0 80px rgba(0, 200, 255, 0.12);
            transform: scale(1.03);
            background: rgba(255, 0, 255, 0.05);
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
        }

        .btn-neon i {
            color: #ff00ff;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .btn-neon:hover i {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        /* ---------- CONTRIBUTORS SECTION (NEON) ---------- */
        .contributors-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contributors-title {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #a07aff;
            text-shadow: 0 0 20px rgba(160, 120, 255, 0.3);
            margin-bottom: 1.2rem;
            font-family: 'Orbitron', sans-serif;
        }

        .contributors-title i {
            color: #ff00ff;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .contributors-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.2rem 2rem;
        }

        .contributor {
            font-size: 0.95rem;
            font-weight: 400;
            color: #00d4ff;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: 1px solid transparent;
            font-family: 'Orbitron', sans-serif;
        }

        .contributor:hover {
            color: #ff6bff;
            border-color: rgba(255, 0, 255, 0.2);
            background: rgba(255, 0, 255, 0.05);
            transform: translateY(-2px);
            text-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.05);
        }

        .contributor i {
            color: #ff00ff;
            margin-right: 6px;
            font-size: 0.8rem;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        /* ---------- FOOTER (NEON) ---------- */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            font-weight: 300;
            color: rgba(160, 120, 255, 0.5);
            text-shadow: 0 0 10px rgba(160, 120, 255, 0.1);
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }

        .footer-note i {
            color: rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.1);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .main-card {
                padding: 2rem 1.5rem 3rem;
                border-radius: 2.5rem;
            }

            .neon-title {
                font-size: 2.6rem;
                letter-spacing: 3px;
            }

            .neon-sub {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }

            .logo-ring {
                width: 110px;
                height: 110px;
            }

            .logo-img {
                width: 100px;
                height: 100px;
            }

            .tagline {
                font-size: 1.1rem;
                padding: 0 0.5rem;
            }

            .social-links {
                gap: 1.2rem;
            }

            .social-link {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }

            .btn-neon {
                padding: 0.7rem 2rem;
                font-size: 0.9rem;
                letter-spacing: 3px;
            }

            .contributors-list {
                gap: 0.8rem 1.5rem;
            }

            .contributor {
                font-size: 0.8rem;
            }

            .flying-controller {
                font-size: 2.5rem !important;
            }
        }

        @media (max-width: 450px) {
            .neon-title {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .logo-ring {
                width: 90px;
                height: 90px;
            }

            .logo-img {
                width: 80px;
                height: 80px;
            }

            .tagline {
                font-size: 0.95rem;
            }

            .flying-controller {
                font-size: 2rem !important;
            }
        }
    </style>
</head>

        </div>

    </div>

    <script>
        // ============================================================
        //  SOUND EFFECTS (Web Audio API - no external files needed!)
        // ============================================================
        class SoundEffects {
            constructor() {
                this.audioCtx = null;
                this.initAudio();
            }

            initAudio() {
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Web Audio API not supported');
                }
            }

            // Glitch sound - static/crunchy noise
            playGlitchSound() {
                if (!this.audioCtx) return;
                
                try {
                    const duration = 0.3;
                    const bufferSize = this.audioCtx.sampleRate * duration;
                    const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    // Create glitchy noise
                    for (let i = 0; i < bufferSize; i++) {
                        if (Math.random() < 0.05) {
                            data[i] = (Math.random() * 2 - 1) * 0.8;
                        } else {
                            data[i] = (Math.random() * 2 - 1) * 0.2;
                        }
                    }
                    
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    
                    const gainNode = this.audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duration);
                    
                    const distortion = this.audioCtx.createWaveShaper();
                    distortion.curve = this.makeDistortionCurve(100);
                    
                    source.connect(distortion);
                    distortion.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    
                    source.start();
                    source.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    // Silently fail if audio can't play
                }
            }

            makeDistortionCurve(amount) {
                const samples = 44100;
                const curve = new Float32Array(samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < samples; ++i) {
                    const x = (i * 2) / samples - 1;
                    curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
                }
                return curve;
            }

            // Click sound - LOUDER short blip
            playClickSound() {
                if (!this.audioCtx) return;
                
                try {
                    const duration = 0.1;
                    const bufferSize = this.audioCtx.sampleRate * duration;
                    const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / bufferSize;
                        // Louder click with more impact
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 20) * 0.7;
                        // Add a sharper attack
                        if (i < bufferSize * 0.05) {
                            data[i] = (Math.random() * 2 - 1) * 0.9;
                        }
                    }
                    
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    
                    const gainNode = this.audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0.6, this.audioCtx.currentTime); // Louder!
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                    
                    source.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    
                    source.start();
                    source.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    // Silently fail
                }
            }

            // Spinning sound - LOUDER whoosh/whir
            playSpinSound() {
                if (!this.audioCtx) return;
                
                try {
                    const duration = 0.8;
                    const bufferSize = this.audioCtx.sampleRate * duration;
                    const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    // Create whooshing sound with more volume
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / bufferSize;
                        const frequency = 150 + t * 400;
                        const osc = Math.sin(2 * Math.PI * frequency * t * 6);
                        const noise = (Math.random() * 2 - 1) * 0.15;
                        // Louder base sound
                        data[i] = (osc * 0.5 + noise) * Math.exp(-t * 2.5);
                        // Add extra punch at the start
                        if (t < 0.1) {
                            data[i] += (Math.random() * 2 - 1) * 0.3 * (1 - t * 10);
                        }
                    }
                    
                    const source = this.audioCtx.createBufferSource();
                    source.buffer = buffer;
                    
                    const gainNode = this.audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0.5, this.audioCtx.currentTime); // Louder!
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                    
                    // Add slight distortion for more presence
                    const distortion = this.audioCtx.createWaveShaper();
                    distortion.curve = this.makeDistortionCurve(20);
                    
                    source.connect(distortion);
                    distortion.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    
                    source.start();
                    source.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    // Silently fail
                }
            }
        }

        // Initialize sounds
        const sounds = new SoundEffects();

        // ============================================================
        //  SOCIAL LINKS CONFIGURATION
        // ============================================================
        const socialLinks = [
            {
                icon: 'fab fa-discord',
                label: 'Discord',
                url: 'https://discord.gg/JBZ3rHnHW'
            },
            {
                icon: 'fab fa-twitch',
                label: 'Twitch',
                url: 'https://twitch.tv/eclipseesportsyt'
            },
            {
                icon: 'fab fa-youtube',
                label: 'YouTube',
                url: 'https://youtube.com/@Teamesports-d3c'
            },
            {
                icon: 'fab fa-tiktok',
                label: 'TikTok',
                url: 'https://tiktok.com/@teameclipsesports1'
            }
        ];

        // ─── Render social links with click sounds ──────────────
        const container = document.getElementById('socialLinks');

        socialLinks.forEach(link => {
            const anchor = document.createElement('a');
            anchor.href = link.url;
            anchor.className = 'social-link';
            anchor.setAttribute('aria-label', link.label);
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            
            // Add click sound
            anchor.addEventListener('click', (e) => {
                sounds.playClickSound();
            });

            const icon = document.createElement('i');
            icon.className = link.icon;

            anchor.appendChild(icon);
            container.appendChild(anchor);
        });

        // ─── Join button click sound ─────────────────────────────
        document.getElementById('joinButton').addEventListener('click', (e) => {
            sounds.playClickSound();
        });

        // ============================================================
        //  GLITCH EFFECT
        // ============================================================
        const glitchOverlay = document.getElementById('glitchOverlay');
        const mainCard = document.getElementById('mainCard');

        function triggerGlitch() {
            // Play glitch sound
            sounds.playGlitchSound();
            
            // Activate overlay
            glitchOverlay.classList.add('active');
            
            // --- VERTICAL GLITCH LINES ---
            const numVerticalLines = Math.floor(Math.random() * 4) + 2;
            for (let i = 0; i < numVerticalLines; i++) {
                const line = document.createElement('div');
                line.className = 'glitch-vertical-line';
                const randomX = Math.random() * 100;
                line.style.left = randomX + '%';
                line.style.height = (Math.random() * 60 + 20) + '%';
                line.style.animationDuration = (Math.random() * 0.6 + 0.4) + 's';
                line.style.animationDelay = (Math.random() * 0.3) + 's';
                
                const isPink = Math.random() > 0.5;
                line.style.background = isPink ? 
                    `rgba(255, 0, 255, ${Math.random() * 0.15 + 0.05})` : 
                    `rgba(0, 200, 255, ${Math.random() * 0.15 + 0.05})`;
                line.style.boxShadow = isPink ?
                    `0 0 10px rgba(255, 0, 255, 0.1), 0 0 20px rgba(0, 200, 255, 0.05)` :
                    `0 0 10px rgba(0, 200, 255, 0.1), 0 0 20px rgba(255, 0, 255, 0.05)`;
                
                glitchOverlay.appendChild(line);
                
                setTimeout(() => {
                    line.remove();
                }, 1500);
            }

            // --- HORIZONTAL GLITCH BARS ---
            const numBars = Math.floor(Math.random() * 6) + 3;
            for (let i = 0; i < numBars; i++) {
                const bar = document.createElement('div');
                bar.className = 'glitch-bar';
                const randomY = Math.random() * 100;
                bar.style.top = randomY + '%';
                bar.style.height = (Math.random() * 4 + 1) + 'px';
                bar.style.animationDuration = (Math.random() * 0.3 + 0.1) + 's';
                bar.style.background = `rgba(${Math.random() > 0.5 ? '255,0,255' : '0,200,255'}, ${Math.random() * 0.15 + 0.05})`;
                glitchOverlay.appendChild(bar);
                
                setTimeout(() => {
                    bar.remove();
                }, 500);
            }

            // --- COLOR SHIFT GLITCH ---
            const colorGlitch = document.createElement('div');
            colorGlitch.className = 'glitch-color';
            glitchOverlay.appendChild(colorGlitch);
            setTimeout(() => {
                colorGlitch.remove();
            }, 200);

            // --- SCREEN SHAKE ---
            mainCard.classList.add('glitch-shake');
            setTimeout(() => {
                mainCard.classList.remove('glitch-shake');
            }, 200);

            setTimeout(() => {
                glitchOverlay.classList.remove('active');
            }, 500);
        }

        // ============================================================
        //  FLYING CONTROLLER
        // ============================================================
        function spawnFlyingController() {
            // Play spinning sound
            sounds.playSpinSound();
            
            const controller = document.createElement('div');
            controller.className = 'flying-controller';
            controller.innerHTML = '<i class="fas fa-gamepad"></i>';
            
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;
            controller.style.left = startX + '%';
            controller.style.top = startY + '%';
            
            const size = Math.random() * 2.5 + 2.5;
            controller.style.fontSize = size + 'rem';
            
            const colors = ['#ff6bff', '#00d4ff', '#a07aff'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            controller.style.color = randomColor;
            controller.style.textShadow = `0 0 20px ${randomColor}40, 0 0 40px ${randomColor}20, 0 0 60px rgba(0, 200, 255, 0.1)`;
            
            const rotation = Math.random() * 720 + 360;
            
            const directions = [
                { dx: 1, dy: 0 },
                { dx: -1, dy: 0 },
                { dx: 0, dy: 1 },
                { dx: 0, dy: -1 },
                { dx: 1, dy: 1 },
                { dx: -1, dy: 1 },
                { dx: 1, dy: -1 },
                { dx: -1, dy: -1 }
            ];
            const direction = directions[Math.floor(Math.random() * directions.length)];
            
            const duration = 2 + Math.random() * 1.5;
            controller.style.animation = 'none';
            document.body.appendChild(controller);
            
            controller.animate([
                { 
                    transform: `translate(0, 0) scale(0.5) rotate(0deg)`,
                    opacity: 0
                },
                { 
                    transform: `translate(${direction.dx * 30}%, ${direction.dy * 30}%) scale(1.2) rotate(${rotation * 0.3}deg)`,
                    opacity: 1,
                    offset: 0.2
                },
                { 
                    transform: `translate(${direction.dx * 60}%, ${direction.dy * 60}%) scale(1) rotate(${rotation * 0.7}deg)`,
                    opacity: 1,
                    offset: 0.6
                },
                { 
                    transform: `translate(${direction.dx * 120}%, ${direction.dy * 120}%) scale(0.8) rotate(${rotation}deg)`,
                    opacity: 0
                }
            ], {
                duration: duration * 1000,
                easing: 'ease-in-out'
            }).onfinish = () => {
                controller.remove();
            };
            
            // Trail effect
            const trail = document.createElement('div');
            trail.className = 'controller-trail';
            trail.style.left = startX + '%';
            trail.style.top = startY + '%';
            trail.style.width = size * 20 + 'px';
            trail.style.height = size * 20 + 'px';
            trail.style.background = `radial-gradient(circle, ${randomColor}20, transparent 70%)`;
            trail.style.borderRadius = '50%';
            trail.style.animation = `fadeTrail ${duration * 0.8}s ease-out forwards`;
            document.body.appendChild(trail);
            
            const trailStyle = document.createElement('style');
            trailStyle.textContent = `
                @keyframes fadeTrail {
                    0% { opacity: 0.5; transform: scale(0.5); }
                    50% { opacity: 0.3; transform: scale(1.5); }
                    100% { opacity: 0; transform: scale(2); }
                }
            `;
            document.head.appendChild(trailStyle);
            
            setTimeout(() => {
                trail.remove();
                trailStyle.remove();
            }, duration * 1000);
        }

        // ============================================================
        //  RANDOM EVENT SCHEDULER
        // ============================================================
        function scheduleRandomEvent() {
            const delay = (Math.random() * 35 + 10) * 1000;
            
            setTimeout(() => {
                const events = [];
                
                if (Math.random() < 0.7) {
                    events.push('glitch');
                }
                
                if (Math.random() < 0.6) {
                    events.push('controller');
                }
                
                if (events.length === 0) {
                    events.push('glitch', 'controller');
                }
                
                events.forEach(event => {
                    if (event === 'glitch') {
                        setTimeout(() => triggerGlitch(), Math.random() * 300);
                    }
                    if (event === 'controller') {
                        setTimeout(() => spawnFlyingController(), Math.random() * 500);
                    }
                });
                
                scheduleRandomEvent();
            }, delay);
        }

        // Start the random event loop
        scheduleRandomEvent();

        // Initial events after 5 seconds
        setTimeout(() => {
            triggerGlitch();
            setTimeout(() => spawnFlyingController(), 800);
        }, 5000);
    </script>
